      <stop offset="1" stop-color="#22cdee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e2f9"/>
      <stop offset="1" stop-color="#06b0d4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="420" fill="url(#halo)"/>
  <g opacity=".14" stroke="#a4effc">
