<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ivula Technologies project reel</title>
  <desc id="desc">An abstract navy and cyan composition celebrating software products made by Ivula Technologies.</desc>
  <defs>
